<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronauta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            height: 100vh;
            width: 100%;
            background-image: url(./imagens/espaco.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-color: black;
            position: relative;
        }

        .astronauta {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 30%;
            height: auto;
            z-index: 10;
        }
    </style>
</head>
<body>
    <img src="imagens/astronauta.png" alt="Astronauta" class="astronauta">
</body>
</html>
