<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 5px 10px;
        }

        thead, tr.media {
            background-color: gray;
            color: white;
        }

        tr.top {
            text-align: center;
        }

        tr.media {
            text-align: left;
            font-weight: bold;
        }

        td.number {
            text-align: center;
        }

        div#container {
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Desafio 14</h1>
    <div id="container">
        <table>
            <thead>
                <tr>
                    <th rowspan="2" scope="col">Área</th>
                    <th rowspan="2" scope="col">Disciplinas</th>
                    <th colspan="2" scope="colgroup">Notas</th>
                    <th rowspan="2" scope="col">Média</th>
                </tr>
                <tr>
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th rowspan="4" scope="rowgroup">Exatas</th>
                    <td>Matemática</td>
                    <td class="number">10.0</td>
                    <td class="number">9.0</td>
                    <td class="number">9.5</td>
                </tr>
                <tr>
                    <td>Física</td>
                    <td class="number">9.0</td>
                    <td class="number">8.0</td>
                    <td class="number">8.5</td>
                </tr>
                <tr>
                    <td>Química</td>
                    <td class="number">8.0</td>
                    <td class="number">7.0</td>
                    <td class="number">7.5</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td class="number">7.0</td>
                    <td class="number">6.0</td>
                    <td class="number">6.5</td>
                </tr>
                <tr class="media">
                    <th colspan="4" scope="row">Média de Exatas</th>
                    <td class="number">8.0</td>
                </tr>
                <tr>
                    <th rowspan="2" scope="rowgroup">Humanas</th>
                    <td>História</td>
                    <td class="number">7.0</td>
                    <td class="number">6.0</td>
                    <td class="number">6.5</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td class="number">5.5</td>
                    <td class="number">7.5</td>
                    <td class="number">6.5</td>
                </tr>
                <tr class="media">
                    <th colspan="4" scope="row">Média de Humanas</th>
                    <td class="number">6.5</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
